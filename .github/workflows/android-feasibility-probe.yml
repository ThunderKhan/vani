name: Android feasibility probe

on:
  push:
    branches: [main, m2-ten-language-credibility]
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "android/feasibility-probe/**"
      - ".github/workflows/android-feasibility-probe.yml"
  pull_request:
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "android/feasibility-probe/**"
      - ".github/workflows/android-feasibility-probe.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Unit test and assemble probe
        run: gradle :android:feasibility-probe:testDebugUnitTest :android:feasibility-probe:assembleDebug --stacktrace
