name: M0 contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate M0 manifests and experiment contracts
        run: python tools/m0_validate.py
      - name: Run M0 unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
